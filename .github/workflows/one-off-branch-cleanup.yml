name: One-off branch cleanup

on:
  push:
    branches:
      - feature/depth-impostor-lod
    paths:
      - .github/workflows/one-off-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const keep = new Set(["main", "feature/depth-impostor-lod"]);
            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );

            const stale = branches.filter(branch => !keep.has(branch.name));
            for (const branch of stale) {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch.name}`
              });
              core.notice(`Deleted obsolete branch: ${branch.name}`);
            }

            // Remove this one-off workflow using GITHUB_TOKEN. GitHub does not
            // trigger another workflow run for the token's own push event.
            const path = ".github/workflows/one-off-branch-cleanup.yml";
            const file = await github.rest.repos.getContent({
              owner, repo, path, ref: "feature/depth-impostor-lod"
            });
            if (!Array.isArray(file.data) && file.data.type === "file") {
              await github.rest.repos.deleteFile({
                owner,
                repo,
                path,
                branch: "feature/depth-impostor-lod",
                sha: file.data.sha,
                message: "Remove one-off branch cleanup workflow"
              });
              core.notice("Removed the one-off cleanup workflow.");
            }
