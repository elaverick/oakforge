name: Python tests

on:
  push:
    branches:
      - main
      - feature/depth-impostor-lod
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglfw3 xvfb
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Bake English oak depth impostor
        run: xvfb-run -a python -m oakforge.render.impostor --config configs/english_oak.yaml --output build/impostor --views 16 --tile-size 192 --layers 4
      - name: Smoke-test runtime depth-impostor shader
        run: xvfb-run -a env OAKFORGE_GL_SMOKE=1 python -m unittest discover -s tests -p test_impostor_runtime_gl.py -v
      - name: Bake matched high-resolution canopy comparison
        run: |
          xvfb-run -a python -m oakforge.render.impostor --config configs/english_oak.yaml --output build/comparison/leaves-only --views 8 --tile-size 512 --layers 3 --columns 8
          xvfb-run -a python -m oakforge.render.impostor --config configs/english_oak.yaml --output build/comparison/with-twigs --views 8 --tile-size 512 --columns 8 --include-twigs
      - name: Upload baked impostor assets and twig comparison
        uses: actions/upload-artifact@v4
        with:
          name: english-oak-depth-impostor
          path: build/
          if-no-files-found: error
