# Isolated oak trunk with six artist-positioned surface roots.
tree:
  name: English Oak - Manual Root Placement Study
  species: Quercus robur
  seed: 27
  parameters:
    trunk:
      # A mature English oak commonly divides into major limbs relatively low down.
      height: 8.0
      base_radius: 1.28
      stem_radius: 0.88
      top_radius: 0.38
      flare_height: 2.7
      buttress_count: 7
      buttress_strength: 0.28
      trunk_irregularity: 0.095
      curve_x: 0.42
      curve_z: -0.34
      sweep_x: 0.24
      sweep_z: 0.19
      stem_bulge_strength: 0.16
      curvature_strength: 0.34
      root_spread: 0.78
      root_count: 7
      root_phase: 0.28
      root_lobe_power: 3.8
      root_valley_depth: 0.12
      bark_ridge_count: 11
      bark_ridge_strength: 0.022
      knuckle_strength: 1.35
      limb_knuckles:
        - {height: 0.68, angle: 0.35, strength: 0.16, width: 0.075}
        - {height: 0.79, angle: 2.45, strength: 0.13, width: 0.065}
        - {height: 0.87, angle: 4.35, strength: 0.12, width: 0.06}
      segments: 72
      taper_power: 0.72
pipeline:
  - call:
      tool: trunk.generate
      args:
        height: "$tree.parameters.trunk.height"
        base_radius: "$tree.parameters.trunk.base_radius"
        stem_radius: "$tree.parameters.trunk.stem_radius"
        top_radius: "$tree.parameters.trunk.top_radius"
        flare_height: "$tree.parameters.trunk.flare_height"
        buttress_count: "$tree.parameters.trunk.buttress_count"
        buttress_strength: "$tree.parameters.trunk.buttress_strength"
        trunk_irregularity: "$tree.parameters.trunk.trunk_irregularity"
        curve_x: "$tree.parameters.trunk.curve_x"
        curve_z: "$tree.parameters.trunk.curve_z"
        sweep_x: "$tree.parameters.trunk.sweep_x"
        sweep_z: "$tree.parameters.trunk.sweep_z"
        stem_bulge_strength: "$tree.parameters.trunk.stem_bulge_strength"
        curvature_strength: "$tree.parameters.trunk.curvature_strength"
        root_spread: "$tree.parameters.trunk.root_spread"
        root_count: "$tree.parameters.trunk.root_count"
        root_phase: "$tree.parameters.trunk.root_phase"
        limb_knuckles: "$tree.parameters.trunk.limb_knuckles"
        knuckle_strength: "$tree.parameters.trunk.knuckle_strength"
        segments: "$tree.parameters.trunk.segments"
        taper_power: "$tree.parameters.trunk.taper_power"
      save_as: trunk
      append_to: groups.trunk
  - call:
      tool: roots.spread
      args:
        trunk: "$trunk"
        tip_height: -0.12
        taper_power: 0.95
        collar_swell: 0.20
        belly_swell: 0.10
        placements:
          - {id: north_west, angle_degrees: 145, attachment_height: 1.42, length: 3.15, base_radius: 0.46, sweep_degrees: -5, segments: 14}
          - {id: north, angle_degrees: 82, attachment_height: 1.30, length: 2.55, base_radius: 0.40, sweep_degrees: 4, segments: 14}
          - {id: north_east, angle_degrees: 24, attachment_height: 1.50, length: 3.35, base_radius: 0.49, sweep_degrees: 7, segments: 14}
          - {id: south_east, angle_degrees: -48, attachment_height: 1.18, length: 2.85, base_radius: 0.43, sweep_degrees: -3, segments: 14}
          - {id: south, angle_degrees: -122, attachment_height: 1.36, length: 3.50, base_radius: 0.52, sweep_degrees: 5, segments: 14}
          - {id: south_west, angle_degrees: 176, attachment_height: 1.24, length: 2.75, base_radius: 0.41, sweep_degrees: -8, segments: 14}
      append_to: groups.roots
  # These offshoots are also manually placed: each names a parent and exact attachment.
  - call:
      tool: roots.branch
      args:
        parents: "$groups.roots"
        placements:
          - {id: north_west_feeder, parent_placement_id: north_west, parent_position: 0.58, angle_degrees: 64, side: 1, length: 1.35, base_radius: 0.19, tip_radius: 0.04, tip_height: -0.12}
          - {id: north_east_feeder, parent_placement_id: north_east, parent_position: 0.62, angle_degrees: 57, side: -1, length: 1.55, base_radius: 0.21, tip_radius: 0.045, tip_height: -0.12}
          - {id: south_feeder, parent_placement_id: south, parent_position: 0.54, angle_degrees: 68, side: 1, length: 1.20, base_radius: 0.18, tip_radius: 0.04, tip_height: -0.12}
      append_to: groups.roots
  - call:
      tool: wood_surface.build
      args:
        branches: ["$groups.trunk", "$groups.roots"]
        voxel_size: 0.075
        blend_width: 0.18
        root_vertical_scale: 1.08
        root_thickness_scale: 0.94
        padding: 0.35
      save_as: wood_surface
